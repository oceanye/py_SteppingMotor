<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#111827">
  <title>电机远程控制</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1220;--card:#182235;--line:#334155;--text:#f8fafc;--muted:#9caac0;--blue:#2f80ed;--red:#e33f4f;--green:#20b486}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Microsoft YaHei",sans-serif}
    header{position:sticky;top:0;z-index:5;padding:12px;background:#111827ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
    .head{max-width:980px;margin:auto;display:flex;align-items:center;gap:10px}.head h1{margin:0;font-size:19px;flex:1}.dot{width:10px;height:10px;border-radius:50%;background:#64748b}.dot.ok{background:var(--green);box-shadow:0 0 10px var(--green)}
    main{max-width:980px;margin:auto;padding:14px}.warning{display:none;padding:13px;margin-bottom:14px;border:1px solid #9b6b13;background:#4b330e;border-radius:10px}.warning.show{display:block}
    section{margin:18px 0}h2{font-size:18px;margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px}.title{display:flex;align-items:center;justify-content:space-between;font-weight:700;margin-bottom:11px}.state{font-size:12px;color:var(--muted)}
    .fields{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px}label{font-size:12px;color:var(--muted)}input,select{display:block;width:100%;margin-top:4px;padding:10px;color:var(--text);background:#0f172a;border:1px solid #475569;border-radius:8px;font-size:16px}
    .buttons{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}button{min-height:44px;border:0;border-radius:9px;background:#334155;color:white;font-weight:700;font-size:15px;touch-action:manipulation}button:active{transform:scale(.98)}.go{background:var(--blue)}.stop{background:#b32838}.enable{background:#177a61}.wide{grid-column:1/-1}
    .estop{width:100%;min-height:58px;background:var(--red);border:2px solid #ff8995;font-size:20px;box-shadow:0 0 18px #e33f4f55}.track-hold{min-height:64px;font-size:17px}.hint{font-size:12px;color:var(--muted);margin:8px 0 0}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:10;max-width:90%;padding:10px 15px;border-radius:9px;background:#25344d;box-shadow:0 6px 25px #0008;display:none}.toast.show{display:block}.toast.bad{background:#7b2230}
    .axis-toolbar{display:flex;gap:10px;align-items:end;margin-bottom:12px}.axis-toolbar label{flex:1;max-width:300px}.topology-note{color:var(--muted);font-size:12px}.route{display:inline-block;margin-top:3px;padding:2px 7px;border:1px solid #475569;border-radius:999px;color:#b9c7dc;font-size:11px}
  </style>
</head>
<body>
  <header><div class="head"><span id="dot" class="dot"></span><h1>电机远程控制</h1><span id="conn" class="state">未连接</span></div></header>
  <main>
    <div class="warning show">此控制页未设置登录或令牌，仅限可信局域网使用。</div>
    <button id="estop" class="estop">紧急停止全部电机</button>

    <section><h2>30 路步进电机</h2><div class="axis-toolbar"><label>控制器分组<select id="stepperGroup"></select></label><span id="topologyNote" class="topology-note">正在读取拓扑…</span></div><div id="steppers" class="grid"></div></section>
    <section><h2>闭环电机</h2><div id="motors" class="grid"></div></section>
    <section><h2>轨道 D（DRV8871）</h2>
      <div class="card">
        <div class="fields"><label>PWM（1–100%）<input id="trackPwm" type="number" value="60" min="1" max="100" step="1"></label><div><div class="state" style="margin-bottom:4px">状态</div><strong id="trackState">停止</strong></div></div>
        <div class="buttons"><button id="trackRev" class="go track-hold">按住后退</button><button id="trackStop" class="stop">停止</button><button id="trackFwd" class="go track-hold">按住前进</button></div>
        <p class="hint">必须持续按住。页面会刷新运行租约；松手、断网或租约超时后应由固件自动停止。</p>
      </div>
    </section>
  </main>
  <div id="toast" class="toast"></div>
  <script>
    'use strict';
    const toast = document.getElementById('toast');
    let toastTimer;
    function notice(text, bad=false){ toast.textContent=text; toast.className='toast show'+(bad?' bad':''); clearTimeout(toastTimer); toastTimer=setTimeout(()=>toast.className='toast',2600); }
    async function api(path, body){
      const opt={headers:{}};
      if(body!==undefined){opt.method='POST';opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body);}
      const res=await fetch(path,opt); let data={}; try{data=await res.json();}catch(_e){}
      if(!res.ok) throw new Error(data.error || `请求失败 (${res.status})`); return data;
    }
    function num(id,min,max){const v=Number(document.getElementById(id).value);if(!Number.isFinite(v)||v<min||v>max)throw new Error(`请输入 ${min}–${max} 的有效数值`);return v;}
    function act(job,ok){Promise.resolve().then(job).then(()=>ok&&notice(ok)).catch(e=>notice(e.message,true));}

    const steppers=document.getElementById('steppers'),stepperGroup=document.getElementById('stepperGroup');
    let stepperTopology=[];
    function fallbackTopology(){return Array.from({length:30},(_v,axis)=>axis<6?{axis,label:['L','R','A','B','C','D'][axis],controller:'esp32',node:null,local_axis:axis,pins:null}:{axis,label:`P${Math.floor((axis-6)/4)+1}-${(axis-6)%4+1}`,controller:'pico',node:Math.floor((axis-6)/4)+1,local_axis:(axis-6)%4,pins:null});}
    function groupKey(t){return t.controller==='esp32'?'esp32':`pico-${t.node}`;}
    function groupLabel(t){return t.controller==='esp32'?'ESP32 本地（6 轴）':`Pico ${t.node}（4 轴）`;}
    function routeLabel(t){if(t.controller==='esp32'){const p=t.pins;return p?`本地 · PUL GPIO${p.pulse} / DIR GPIO${p.direction}`:'ESP32 本地';}return `RS485 · Pico ${t.node} · 本地轴 ${Number(t.local_axis)+1}`;}
    function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    function buildSteppers(topology){
      stepperTopology=topology.length?topology:fallbackTopology();steppers.textContent='';stepperGroup.textContent='';
      const groups=[];for(const t of stepperTopology){const key=groupKey(t);if(!groups.some(g=>g.key===key))groups.push({key,label:groupLabel(t)});}
      for(const g of groups)stepperGroup.insertAdjacentHTML('beforeend',`<option value="${esc(g.key)}">${esc(g.label)}</option>`);
      for(const t of stepperTopology){const a=Number(t.axis);steppers.insertAdjacentHTML('beforeend',`<div class="card" data-axis-card="${a}" data-group="${esc(groupKey(t))}"><div class="title"><span>轴 ${esc(t.label||a)}</span><span id="sstate${a}" class="state">--</span></div><span class="route">${esc(routeLabel(t))}</span><div class="fields"><label>模式<select id="smode${a}"><option value="linear">直线 (mm)</option><option value="rotary">旋转 (°)</option></select></label><label>减速比<input id="sgr${a}" type="number" value="1" min="0.001" max="1000" step="0.01"></label><label>距离 (<span id="sunit${a}">mm</span>)<input id="dist${a}" type="number" value="10" min="0.001" max="100000" step="0.1"></label><label>速度 (<span id="sunits${a}">mm/s</span>)<input id="speed${a}" type="number" value="5" min="0.001" max="10000" step="0.1"></label></div><div class="buttons"><button class="go" data-step="reverse" data-axis="${a}">反向</button><button class="stop" data-step="stop" data-axis="${a}">停止</button><button class="go" data-step="forward" data-axis="${a}">正向</button></div><button class="enable wide" data-step="applycfg" data-axis="${a}">应用模式/减速比</button></div>`);}
      showStepperGroup();document.getElementById('topologyNote').textContent=`${stepperTopology.length} 轴 · ESP32 本地 + 6 个普通 Pico`;
    }
    function showStepperGroup(){const selected=stepperGroup.value;for(const card of steppers.querySelectorAll('[data-axis-card]'))card.hidden=card.dataset.group!==selected;}
    stepperGroup.addEventListener('change',showStepperGroup);buildSteppers(fallbackTopology());
    steppers.addEventListener('click',e=>{const b=e.target.closest('button[data-step]');if(!b)return;const axis=Number(b.dataset.axis),direction=b.dataset.step,label=stepperTopology.find(t=>Number(t.axis)===axis)?.label??axis;if(direction==='stop')act(()=>api('/api/stepper/stop',{axis}),`轴 ${label} 已停止`);else if(direction==='applycfg')act(()=>api('/api/stepper/config',{axis,mode:document.getElementById(`smode${axis}`).value,gear_ratio:num(`sgr${axis}`,.001,1000)}),`轴 ${label} 模式/减速比已应用`);else act(()=>api('/api/stepper/move',{axis,direction,distance_mm:num(`dist${axis}`,.001,100000),speed_mm_s:num(`speed${axis}`,.001,10000)}),`轴 ${label} 命令已发送`);});

    const motors=document.getElementById('motors');
    for(let a=0;a<2;a++) motors.insertAdjacentHTML('beforeend',`<div class="card"><div class="title"><span>闭环轴 ${a+1}</span><span id="mstate${a}" class="state">--</span></div><div class="fields"><label>控制模式<select id="mode${a}"><option>GEAR</option><option>FOC</option></select></label><label>目标角 (°)<input id="target${a}" type="number" value="0" min="-3600" max="3600" step="1"></label></div><div class="buttons"><button class="enable" data-motor="enable" data-axis="${a}">使能</button><button data-motor="zero" data-axis="${a}">归零</button><button class="stop" data-motor="disable" data-axis="${a}">失能</button><button class="go wide" data-motor="target" data-axis="${a}">发送目标角</button></div></div>`);
    motors.addEventListener('click',e=>{const b=e.target.closest('button[data-motor]');if(!b)return;const axis=Number(b.dataset.axis),action=b.dataset.motor,mode=document.getElementById(`mode${axis}`).value;const body={mode,axis,action};if(action==='target')body.target_deg=num(`target${axis}`,-3600,3600);act(()=>api('/api/motor',body),`闭环轴 ${axis+1}：${action}`);});

    let leaseTimer=null,holding=null;
    function trackBody(action){return action==='stop'?{action}:{action,pwm:num('trackPwm',1,100),lease_ms:1000};}
    function stopTrack(show=false){holding=null;clearInterval(leaseTimer);leaseTimer=null;act(()=>api('/api/track',{action:'stop'}),show?'轨道已停止':null);}
    function startTrack(action,button,event){event.preventDefault();if(holding)return;holding=action;try{button.setPointerCapture(event.pointerId);}catch(_e){}const send=()=>api('/api/track',trackBody(action)).catch(e=>{notice(e.message,true);stopTrack(false);});send();leaseTimer=setInterval(send,350);document.getElementById('trackState').textContent=action==='forward'?'前进':'后退';}
    [['trackFwd','forward'],['trackRev','reverse']].forEach(([id,dir])=>{const b=document.getElementById(id);b.addEventListener('pointerdown',e=>startTrack(dir,b,e));['pointerup','pointercancel','lostpointercapture'].forEach(n=>b.addEventListener(n,()=>{if(holding)stopTrack(false);}));});
    document.getElementById('trackStop').addEventListener('click',()=>stopTrack(true));
    window.addEventListener('blur',()=>{if(holding)stopTrack(false)});document.addEventListener('visibilitychange',()=>{if(document.hidden&&holding)stopTrack(false)});

    document.getElementById('estop').addEventListener('click',()=>{holding=null;clearInterval(leaseTimer);leaseTimer=null;act(()=>api('/api/estop',{}),'固件已确认全部软件停车命令');});

    function stateText(v){if(v==null)return '--';if(typeof v==='string'||typeof v==='number')return String(v);if(typeof v==='boolean')return v?'运行':'停止';return JSON.stringify(v);}
    async function refresh(){try{const s=await api('/api/status');document.getElementById('dot').classList.toggle('ok',!!s.connected);document.getElementById('conn').textContent=s.connected?'串口已连接':'服务在线 · 串口未连接';const incoming=s.topology?.axes||[];if(incoming.length&&JSON.stringify(incoming)!==JSON.stringify(stepperTopology))buildSteppers(incoming);const ss=s.steppers||[],axes=s.stepper_axes||[];for(const t of stepperTopology){const i=Number(t.axis),state=document.getElementById(`sstate${i}`),ax=axes[i];if(state)state.textContent=stateText(ss[i]);if(!ax)continue;const deg=ax.mode==='rotary',unit=document.getElementById(`sunit${i}`),units=document.getElementById(`sunits${i}`);if(unit)unit.textContent=deg?'°':'mm';if(units)units.textContent=deg?'°/s':'mm/s';const sm=document.getElementById(`smode${i}`);if(sm&&document.activeElement!==sm)sm.value=ax.mode||'linear';const sg=document.getElementById(`sgr${i}`);if(sg&&document.activeElement!==sg)sg.value=ax.gear_ratio??1;}const ms=s.motors||[];for(let i=0;i<2;i++)document.getElementById(`mstate${i}`).textContent=stateText(ms[i]);if(s.mode==='FOC'||s.mode==='GEAR')for(let i=0;i<2;i++)document.getElementById(`mode${i}`).value=s.mode;if(s.track!==undefined&&!holding)document.getElementById('trackState').textContent=stateText(s.track);}catch(_e){document.getElementById('dot').classList.remove('ok');document.getElementById('conn').textContent='网页服务连接中断';}}
    refresh();setInterval(refresh,1000);
  </script>
</body>
</html>
