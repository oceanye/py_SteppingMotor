[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = COM4
monitor_port = COM4
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv

; Native host test environment for pure-logic modules (no Arduino deps).
; Task C1 将替换下面这行 build_src_filter 为 +<protocol_parser.cpp>
[env:native_test]
platform = native
test_framework = unity
build_flags = -std=gnu++17
build_src_filter = -<*>

