; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; 默认 = esp32s3_gear（Phase 1 GEAR 模式，新板 COM9）。
; 切回 FOC + 步进老板子时显式指定：pio run -e esp32s3 -t upload
; native_test 需要主机 gcc：pio test -e native_test
default_envs = esp32s3_gear

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = COM4
monitor_port = COM4
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_flags = -DDRIVE_MODE_FOC
build_src_filter = +<*> -<gear_motor.cpp> -<minimal_test.cpp>
lib_deps =
  askuric/Simple FOC @ 2.3.3

[env:esp32s3_gear]
; Phase 1: 新 ESP32-S3 板专用 GEAR 模式固件（DRV8871 + N20，不含步进、不含 FOC）。
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = COM9
monitor_port = COM9
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_flags = -DDRIVE_MODE_GEAR
build_src_filter = +<*> -<foc_motor.cpp> -<minimal_test.cpp>
; lib_deps 不需要 SimpleFOC（用 ESP-IDF 自带 PCNT + LEDC）

[env:esp32s3_minimal]
; 板子健康度测试：只编 minimal_test.cpp，每秒串口打印 + LED 闪。
; 如果这个能跑、上面的 esp32s3_gear 不能跑，说明 GEAR 固件有 bug。
; 如果连这个也 reset loop，说明 ESP32 板子物理损坏。
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = COM9
monitor_port = COM9
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_flags = -DMINIMAL_TEST_BUILD
build_src_filter = -<*> +<minimal_test.cpp>

[env:native_test]
platform = native
test_framework = unity
build_flags = -std=gnu++17
build_src_filter = -<*>
